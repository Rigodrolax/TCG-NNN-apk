name: APK Cartes NNN

# Construit l'APK à chaque modification de la branche main.
#  - Si la version écrite dans version.txt n'a pas encore de Release → APK signée publiée dans une Release "vX.Y.Z"
#    (c'est elle que les kheys téléchargent). Pour publier une nouvelle version : changer version.txt.
#  - Sinon → simple build de test (APK dans les artefacts du build).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/**', '.github/workflows/**', '*.gradle', 'version.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true; fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; PUB=1
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then PUB=0; V="$V-test${GITHUB_RUN_NUMBER}"
          else PUB=1; fi
          echo "NNN_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "NNN_PUBLISH=$PUB" >> "$GITHUB_ENV"
          echo "NNN_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Version $V (publication : $PUB)"

      - name: Clé de signature
        env:
          KS: ${{ secrets.NNN_KEYSTORE_B64 }}
          PW: ${{ secrets.NNN_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            # sans la clé : simple APK de test (jamais publiée, sinon les mises à jour seraient impossibles)
            echo "NNN_PUBLISH=0" >> "$GITHUB_ENV"
            echo "::warning::Il manque les secrets NNN_KEYSTORE_B64 et NNN_KEYSTORE_PASS (Settings → Secrets and variables → Actions) : APK de test seulement, rien n'est publié. Voir le README."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/nnn.jks"
          echo "NNN_KEYSTORE_FILE=$RUNNER_TEMP/nnn.jks" >> "$GITHUB_ENV"
          echo "NNN_KEYSTORE_PASS=$PW" >> "$GITHUB_ENV"

      - name: Jeu (dernière version du script sur Rigodrolax/TCG-NNN)
        run: |
          curl -fsSL -o app/src/main/assets/game.user.js https://raw.githubusercontent.com/Rigodrolax/TCG-NNN/main/nnn-cartes-balade92.user.js
          head -5 app/src/main/assets/game.user.js
          test $(stat -c %s app/src/main/assets/game.user.js) -gt 1000000

      - name: Construction
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Erreurs de construction
        if: failure()
        run: |
          grep -E "error:|FAILURE|What went wrong|Could not|\.java:[0-9]+|> " build.log | head -40 > err.txt || true
          echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"

      - name: Renommage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CartesNNN.apk   # nom fixe : le lien de téléchargement ne change jamais
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CartesNNN-${{ env.NNN_VERSION_NAME }}
          path: dist/*.apk

      - name: Release
        if: env.NNN_PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NNN_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          name: Cartes NNN ${{ env.NNN_VERSION_NAME }}
          body: |
            Télécharge **CartesNNN.apk** ci-dessous (lien direct : https://github.com/Rigodrolax/TCG-NNN-apk/releases/latest/download/CartesNNN.apk) et ouvre-le sur ton téléphone Android.
            Si Android le demande, autorise l'installation depuis ton navigateur / ton gestionnaire de fichiers.
            Le jeu se met à jour tout seul depuis GitHub : pas besoin de réinstaller l'appli à chaque nouvelle version du script.
